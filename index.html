<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク＆タイムライン</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-color: #29b6f6;
      --accent-start: #0288d1;
      --accent-stop: #ff5252;
      --active-bg: #0d233a;
      --slot-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: bold;
      padding: 12px;
    }

    .hidden { display: none !important; }

    .auth-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .tab-header {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      font-size: 1rem;
      font-weight: 900;
      background-color: #2a2a2a;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000000;
      border-color: var(--accent-color);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="text"], input[type="date"], select, textarea {
      background-color: #2c2c2c;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      user-select: text;
    }

    textarea { width: 100%; height: 80px; resize: vertical; }

    button {
      font-weight: 900;
      font-size: 0.95rem;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-add { background-color: var(--accent-color); color: #000; }
    .btn-start { background-color: var(--accent-start); color: #fff; }
    .btn-stop { background-color: var(--accent-stop); color: #fff; }
    .btn-edit { background-color: #f57c00; color: #fff; }
    .btn-del { background-color: #444; color: #fff; }

    .template-box {
      background-color: #1a1a1a;
      border: 1px dashed var(--border-color);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .template-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-template {
      background-color: #2a2a2a;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .btn-template:hover {
      background-color: var(--accent-color);
      color: #000;
    }

    .active-container {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .analog-clock-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #analogClock {
      background-color: #1a1a1a;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 8px;
      text-align: left;
      font-size: 0.95rem;
    }

    th { background-color: #2a2a2a; color: var(--text-main); }

    .timer-text {
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .task-sub-info {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: normal;
    }

    .unassigned-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background-color: #1a1a1a;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      min-height: 50px;
      margin-bottom: 12px;
    }

    .pool-item {
      background-color: #0288d1;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .timeline-wrapper {
      position: relative;
      background-color: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .timeline-grid { display: flex; flex-direction: column; }

    .time-slot {
      height: var(--slot-height);
      display: flex;
      border-bottom: 1px solid #2a2a2a;
      position: relative;
    }

    .time-label {
      width: 65px;
      background-color: #222222;
      color: var(--text-sub);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .time-lane { flex: 1; position: relative; }

    .draggable-task {
      position: absolute;
      left: 70px;
      right: 10px;
      background-color: #0288d1;
      color: #ffffff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      cursor: grab;
      touch-action: none;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .draggable-task:active { cursor: grabbing; opacity: 0.85; z-index: 20; }
    .draggable-task.completed { background-color: var(--accent-color); color: #000000; }

    .btn-group-mini {
      display: flex;
      gap: 4px;
    }

    .btn-group-mini button { padding: 4px 6px; font-size: 0.75rem; line-height: 1; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 90%; max-width: 550px;
      max-height: 85vh; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }

    .checklist-item {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }

    .checklist-item input[type="text"] { flex: 1; padding: 6px; }

    .history-log-text {
      background-color: #111;
      color: #29b6f6;
      font-family: monospace;
      padding: 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.9rem;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="auth-bar">
    <div id="auth-status-text">未ログイン（非同期モード）</div>
    <div>
      <button id="login-btn" class="btn-add">Googleログイン</button>
      <button id="logout-btn" class="btn-del hidden">ログアウト</button>
    </div>
  </div>

  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab('taskTab', this)">📋 タスク管理</button>
    <button class="tab-btn" onclick="switchTab('timelineTab', this)">⏰ タイムライン</button>
    <button class="tab-btn" onclick="switchTab('historyTab', this)">✅ 完了・ログ</button>
  </div>

  <div id="taskTab" class="tab-content active">
    
    <div class="card" style="border: 2px solid var(--accent-color);">
      <h2>🔥 実行中タスク（タスク着手中エリア）</h2>
      <div class="active-container">
        <div class="analog-clock-wrapper">
          <canvas id="analogClock" width="100" height="100"></canvas>
        </div>
        <div style="flex: 1; min-width: 250px; overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>タスク詳細</th>
                <th>経過時間</th>
                <th>タイマー操作</th>
              </tr>
            </thead>
            <tbody id="activeTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>
        <span>1. タスク登録（一括入力）</span>
        <button class="btn-edit" style="font-size:0.8rem;" onclick="openTemplateManagerModal()">⚙️ 定型文編集</button>
      </h2>
      
      <div class="template-box">
        <div style="font-size:0.85rem; color:var(--text-sub);">⚡ よく使うタスク（ワンタッチで全自動入力）:</div>
        <div class="template-btns" id="templateBtnsContainer"></div>
      </div>

      <div class="input-group">
        <textarea id="bulkInput" placeholder="例:&#10;メール返信, 15&#10;夜のルーティン, 30&#10;資料作成, 45"></textarea>
        <button class="btn-add" onclick="addBulkTasks()">タスクを一括登録する</button>
      </div>
    </div>

    <div class="card">
      <h2>2. 登録済みタスク（着手待ち）</h2>
      <table>
        <thead>
          <tr>
            <th>タスク詳細</th>
            <th>予定(分)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="registeredTableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="timelineTab" class="tab-content">
    <div class="card">
      <h2>未配置の登録タスク（タップで配置）</h2>
      <div class="unassigned-pool" id="unassignedPool"></div>
    </div>

    <div class="card">
      <h2>24時間 タイムライン（ドラッグで移動）</h2>
      <div style="margin-bottom: 10px;">
        <button class="btn-add" onclick="addQuickTimelineTask()">＋ クイックタスク追加</button>
      </div>
      <div class="timeline-wrapper" id="timelineWrapper">
        <div class="timeline-grid" id="timelineGrid"></div>
        <div id="timelineTasksContainer"></div>
      </div>
    </div>
  </div>

  <div id="historyTab" class="tab-content">
    <div class="card">
      <h2>✅ 本日の完了エリア ＆ 過去ログ</h2>
      <div style="margin-bottom: 12px; display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn-add" onclick="openHistoryModal()">📅 保存された全記録ログを見る</button>
        <button class="btn-del" onclick="clearCompletedScreenOnly()">🧹 画面のリストを消去（クラウドログは残ります）</button>
        <button class="btn-edit" onclick="downloadCompletedTasks()">📄 テキスト出力(文字化け対策済)</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>タスク名</th>
            <th>開始</th>
            <th>終了</th>
            <th>実績時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 日付選択完了モーダル -->
  <div id="completeDateModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>📅 完了日を選択</h2>
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">記録する完了日付を選んでください:</label>
        <input type="date" id="customCompleteDate" style="width:100%; margin-top:6px;">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
        <button class="btn-del" onclick="closeCompleteDateModal()">キャンセル</button>
        <button class="btn-add" onclick="confirmCustomDateCompletion()">この日付で完了する</button>
      </div>
    </div>
  </div>

  <div id="templateModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>⚙️ 定型タスク（よく使うタスク）編集</h2>
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">タスク名</label>
        <input type="text" id="tplTitleInput" placeholder="例: 夜のルーティン" style="width:100%;">
      </div>
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">予定時間（分）</label>
        <input type="text" id="tplEstInput" value="30" style="width:100%;">
      </div>
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">工程・行程（1行につき1項目）</label>
        <textarea id="tplSubInput" placeholder="例:&#10;ストレッチ&#10;日記を書く&#10;明日の準備"></textarea>
      </div>
      <button class="btn-add" onclick="saveTemplateFromModal()">定型タスクを追加保存</button>

      <div style="border-top: 1px solid var(--border-color); pt-2; margin-top:8px;">
        <label style="font-size:0.85rem; color:var(--text-sub);">登録済み定型一覧:</label>
        <div id="templateManageList" style="margin-top:6px;"></div>
      </div>
      
      <div style="display:flex; justify-content:flex-end; margin-top:8px;">
        <button class="btn-del" onclick="closeTemplateManagerModal()">閉じる</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 style="margin-bottom:0;">タスクの編集・詳細</h2>
      
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">タスク名</label>
        <input type="text" id="modalName" style="width:100%;">
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">予定時間（分）</label>
        <input type="text" id="modalEst" style="width:100%;">
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">メモ（URL、必要な道具など）</label>
        <textarea id="modalMemo" placeholder="例: 参考URL: https://...\n準備物: ノート、資料"></textarea>
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">工程チェックリスト</label>
        <div id="modalChecklistContainer"></div>
        <button class="btn-add" style="margin-top:4px; font-size:0.8rem;" onclick="addModalChecklistItem()">＋ 項目追加</button>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="btn-del" onclick="closeEditModal()">キャンセル</button>
        <button class="btn-add" onclick="saveModalChanges()">保存</button>
      </div>
    </div>
  </div>

  <div id="historyModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>📅 永久保存版・日々の活動記録</h2>
      
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">閲覧したい日付を選択:</label>
        <select id="historyDateSelect" style="width:100%; margin-top:4px;" onchange="loadHistoryLogByDate(this.value)">
          <option value="">日付を選択してください</option>
        </select>
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">記録ログ（テキスト）:</label>
        <div id="historyLogDisplay" class="history-log-text">日付を選択するとここにログが表示されます</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <button class="btn-edit" onclick="copyHistoryLog()">📋 ログをコピー</button>
        <button class="btn-del" onclick="closeHistoryModal()">閉じる</button>
      </div>
    </div>
  </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBeBKeUH6NCRux5djZh5-E5GG4AV2yzZVM",
      authDomain: "taskmanager-36d84.firebaseapp.com",
      projectId: "taskmanager-36d84",
      storageBucket: "taskmanager-36d84.firebasestorage.app",
      messagingSenderId: "445804545228",
      appId: "1:445804545228:web:b6f0259243e5acd9296e69"
    };

    const ALLOWED_EMAIL = "owlbird124@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let unsubscribeSnapshot = null;
    let pendingCompleteTaskId = null;

    window.registeredTasks = JSON.parse(localStorage.getItem('tb_registered')) || [];
    window.activeTasks = JSON.parse(localStorage.getItem('tb_active')) || [];
    window.completedTasks = JSON.parse(localStorage.getItem('tb_completed')) || [];
    window.timelineTasks = JSON.parse(localStorage.getItem('tb_timeline')) || [];
    window.taskTemplates = JSON.parse(localStorage.getItem('tb_templates')) || [
      { id: '1', title: '夜のルーティン', est: 30, sub: 'ストレッチ\n日記を書く\n明日の準備' }
    ];

    window.timerInterval = null;

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const statusText = document.getElementById('auth-status-text');

    loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (user.email === ALLOWED_EMAIL) {
          currentUser = user;
          statusText.textContent = `同期中: ${user.email}`;
          loginBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
          setupFirebaseSync();
        } else {
          alert("許可されていないアカウントです。");
          signOut(auth);
        }
      } else {
        currentUser = null;
        statusText.textContent = "未ログイン（ローカル保存のみ）";
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        if (unsubscribeSnapshot) unsubscribeSnapshot();
      }
    });

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    window.saveData = async function() {
      localStorage.setItem('tb_registered', JSON.stringify(window.registeredTasks));
      localStorage.setItem('tb_active', JSON.stringify(window.activeTasks));
      localStorage.setItem('tb_completed', JSON.stringify(window.completedTasks));
      localStorage.setItem('tb_timeline', JSON.stringify(window.timelineTasks));
      localStorage.setItem('tb_templates', JSON.stringify(window.taskTemplates));

      if (currentUser) {
        try {
          await setDoc(doc(db, "users", currentUser.uid), {
            registered: window.registeredTasks,
            active: window.activeTasks,
            completed: window.completedTasks,
            timeline: window.timelineTasks,
            templates: window.taskTemplates,
            updatedAt: new Date().toISOString()
          });
        } catch (e) {
          console.error("Firebase保存エラー:", e);
        }
      }
    };

    async function archiveCompletedTaskToFirestore(completedTaskItem, customDateKey = null) {
      if (!currentUser) return;
      try {
        const targetDateKey = customDateKey || getTodayKey();
        const logDocRef = doc(db, "users", currentUser.uid, "daily_logs", targetDateKey);
        await setDoc(logDocRef, {
          date: targetDateKey,
          tasks: arrayUnion(completedTaskItem),
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("永久アーカイブ保存エラー:", e);
      }
    }

    function setupFirebaseSync() {
      if (!currentUser) return;
      const docRef = doc(db, "users", currentUser.uid);

      unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          window.registeredTasks = data.registered || [];
          window.activeTasks = data.active || [];
          window.completedTasks = data.completed || [];
          window.timelineTasks = data.timeline || [];
          window.taskTemplates = data.templates || window.taskTemplates;

          localStorage.setItem('tb_registered', JSON.stringify(window.registeredTasks));
          localStorage.setItem('tb_active', JSON.stringify(window.activeTasks));
          localStorage.setItem('tb_completed', JSON.stringify(window.completedTasks));
          localStorage.setItem('tb_timeline', JSON.stringify(window.timelineTasks));
          localStorage.setItem('tb_templates', JSON.stringify(window.taskTemplates));

          renderAll();
        }
      });
    }

    // タブ切り替え
    window.switchTab = function(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if (tabId === 'timelineTab') renderTimeline();
    };

    // タスク完了処理（指定日付にも対応）
    window.completeActiveTask = function(taskId, customDateStr = null) {
      const index = window.activeTasks.findIndex(t => t.id === taskId);
      if (index === -1) return;

      const task = window.activeTasks[index];
      const now = new Date();
      let dateKey = getTodayKey();

      if (customDateStr) {
        dateKey = customDateStr;
      }

      const completedItem = {
        ...task,
        completedAt: now.toISOString(),
        completedDate: dateKey,
        elapsedSeconds: task.elapsedSeconds || 0
      };

      window.completedTasks.unshift(completedItem);
      window.activeTasks.splice(index, 1);

      // タイムライン上の該当タスクも完了にする
      const tlTask = window.timelineTasks.find(t => t.id === taskId);
      if (tlTask) tlTask.completed = true;

      window.saveData();
      archiveCompletedTaskToFirestore(completedItem, dateKey);
      renderAll();
    };

    // 長押し＆クリック判定イベントの登録用関数
    window.attachHoldCompleteEvent = function(buttonElement, taskId) {
      let holdTimer = null;
      let isLongPress = false;

      const startHold = (e) => {
        isLongPress = false;
        holdTimer = setTimeout(() => {
          isLongPress = true;
          window.openCompleteDateModal(taskId);
        }, 600); // 0.6秒長押しで日付選択モーダル起動
      };

      const cancelHold = () => {
        if (holdTimer) clearTimeout(holdTimer);
      };

      const handleClick = (e) => {
        e.preventDefault();
        if (!isLongPress) {
          window.completeActiveTask(taskId);
        }
      };

      buttonElement.addEventListener('mousedown', startHold);
      buttonElement.addEventListener('touchstart', startHold, { passive: true });
      buttonElement.addEventListener('mouseup', cancelHold);
      buttonElement.addEventListener('mouseleave', cancelHold);
      buttonElement.addEventListener('touchend', cancelHold);
      buttonElement.addEventListener('click', handleClick);
    };

    // 日付指定完了モーダルの操作
    window.openCompleteDateModal = function(taskId) {
      pendingCompleteTaskId = taskId;
      const modal = document.getElementById('completeDateModal');
      const dateInput = document.getElementById('customCompleteDate');
      dateInput.value = getTodayKey();
      modal.classList.remove('hidden');
    };

    window.closeCompleteDateModal = function() {
      pendingCompleteTaskId = null;
      document.getElementById('completeDateModal').classList.add('hidden');
    };

    window.confirmCustomDateCompletion = function() {
      const dateInput = document.getElementById('customCompleteDate');
      if (!dateInput.value) {
        alert("日付を選択してください。");
        return;
      }
      if (pendingCompleteTaskId) {
        window.completeActiveTask(pendingCompleteTaskId, dateInput.value);
        window.closeCompleteDateModal();
      }
    };

    // 一括登録
    window.addBulkTasks = function() {
      const text = document.getElementById('bulkInput').value.trim();
      if (!text) return;

      const lines = text.split('\n');
      lines.forEach(line => {
        if (!line.trim()) return;
        const parts = line.split(/[,，]/);
        const title = parts[0].trim();
        const est = parts[1] ? parseInt(parts[1].trim(), 10) || 30 : 30;

        if (title) {
          window.registeredTasks.push({
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            title: title,
            est: est,
            checklist: [],
            memo: '',
            elapsedSeconds: 0
          });
        }
      });

      document.getElementById('bulkInput').value = '';
      window.saveData();
      renderAll();
    };

    // 着手待ちから実行中に移動
    window.startTask = function(taskId) {
      const index = window.registeredTasks.findIndex(t => t.id === taskId);
      if (index === -1) return;

      const task = window.registeredTasks[index];
      task.startTime = new Date().toISOString();
      task.isPaused = false;

      window.activeTasks.push(task);
      window.registeredTasks.splice(index, 1);

      window.saveData();
      renderAll();
    };

    // タイマーの 一時停止 / 再開
    window.togglePauseTimer = function(taskId) {
      const task = window.activeTasks.find(t => t.id === taskId);
      if (!task) return;

      task.isPaused = !task.isPaused;
      window.saveData();
      renderAll();
    };

    // 描画メイン処理
    function renderAll() {
      renderActiveTasks();
      renderRegisteredTasks();
      renderCompletedTasks();
      renderTemplates();
      renderUnassignedPool();
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderActiveTasks() {
      const tbody = document.getElementById('activeTableBody');
      tbody.innerHTML = '';

      window.activeTasks.forEach(task => {
        const tr = document.createElement('tr');
        const elapsed = task.elapsedSeconds || 0;

        tr.innerHTML = `
          <td>
            <div>${task.title} (予定:${task.est}分)</div>
            <div class="task-sub-info">${task.memo ? '📝 ' + task.memo : ''}</div>
          </td>
          <td class="timer-text" id="timer-${task.id}">${formatTime(elapsed)}</td>
          <td>
            <div class="btn-group-mini">
              <button class="${task.isPaused ? 'btn-start' : 'btn-stop'}" onclick="togglePauseTimer('${task.id}')">
                ${task.isPaused ? '再開' : '一時停止'}
              </button>
              <button class="btn-add complete-btn-hold" id="complete-btn-${task.id}">完了</button>
            </div>
          </td>
        `;

        tbody.appendChild(tr);

        // イベントリスナーの動的付与（長押しで日付指定）
        const completeBtn = tr.querySelector(`#complete-btn-${task.id}`);
        if (completeBtn) {
          window.attachHoldCompleteEvent(completeBtn, task.id);
        }
      });
    }

    function renderRegisteredTasks() {
      const tbody = document.getElementById('registeredTableBody');
      tbody.innerHTML = '';

      window.registeredTasks.forEach((task, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${task.title}</td>
          <td>${task.est}</td>
          <td>
            <div class="btn-group-mini">
              <button class="btn-start" onclick="startTask('${task.id}')">着手</button>
              <button class="btn-del" onclick="deleteRegisteredTask(${idx})">削除</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderCompletedTasks() {
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '';

      window.completedTasks.forEach(task => {
        const tr = document.createElement('tr');
        const startDate = task.startTime ? new Date(task.startTime) : null;
        const endDate = task.completedAt ? new Date(task.completedAt) : null;

        const startStr = startDate ? `${startDate.getHours()}:${String(startDate.getMinutes()).padStart(2, '0')}` : '-';
        const endStr = endDate ? `${endDate.getHours()}:${String(endDate.getMinutes()).padStart(2, '0')}` : '-';
        const displayDate = task.completedDate ? ` [${task.completedDate}]` : '';

        tr.innerHTML = `
          <td>${task.title}${displayDate}</td>
          <td>${startStr}</td>
          <td>${endStr}</td>
          <td>${Math.round((task.elapsedSeconds || 0) / 60)}分</td>
          <td>
            <button class="btn-del" onclick="removeCompletedTask('${task.id}')">削除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.removeCompletedTask = function(taskId) {
      window.completedTasks = window.completedTasks.filter(t => t.id !== taskId);
      window.saveData();
      renderAll();
    };

    window.deleteRegisteredTask = function(index) {
      window.registeredTasks.splice(index, 1);
      window.saveData();
      renderAll();
    };

    window.clearCompletedScreenOnly = function() {
      if (confirm("画面上の完了リストをクリアしますか？（クラウド保存済みのログは消えません）")) {
        window.completedTasks = [];
        window.saveData();
        renderAll();
      }
    };

    // タイマーカウントループ
    setInterval(() => {
      window.activeTasks.forEach(task => {
        if (!task.isPaused) {
          task.elapsedSeconds = (task.elapsedSeconds || 0) + 1;
          const el = document.getElementById(`timer-${task.id}`);
          if (el) el.textContent = formatTime(task.elapsedSeconds);
        }
      });
    }, 1000);

    // 定型タスク・テンプレート機能
    function renderTemplates() {
      const container = document.getElementById('templateBtnsContainer');
      container.innerHTML = '';

      window.taskTemplates.forEach(tpl => {
        const btn = document.createElement('button');
        btn.className = 'btn-template';
        btn.textContent = `＋ ${tpl.title} (${tpl.est}分)`;
        btn.onclick = () => addTemplateTask(tpl);
        container.appendChild(btn);
      });
    }

    function addTemplateTask(tpl) {
      const checklist = tpl.sub ? tpl.sub.split('\n').filter(s => s.trim()).map(item => ({ text: item.trim(), done: false })) : [];
      window.registeredTasks.push({
        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
        title: tpl.title,
        est: tpl.est,
        checklist: checklist,
        memo: '',
        elapsedSeconds: 0
      });
      window.saveData();
      renderAll();
    }

      window.saveData();
      renderTemplates();
      renderTemplateManageList();
    };

    // タイムライン関連
    function renderUnassignedPool() {
      const pool = document.getElementById('unassignedPool');
      pool.innerHTML = '';

      window.registeredTasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'pool-item';
        div.textContent = `${task.title} (${task.est}分)`;
        div.onclick = () => assignTaskToTimeline(task);
        pool.appendChild(div);
      });
    }

    function assignTaskToTimeline(task) {
      const existing = window.timelineTasks.find(t => t.id === task.id);
      if (!existing) {
        window.timelineTasks.push({
          ...task,
          startHour: 9,
          completed: false
        });
        window.saveData();
        renderTimeline();
      }
    }

    function renderTimeline() {
      const grid = document.getElementById('timelineGrid');
      const container = document.getElementById('timelineTasksContainer');
      grid.innerHTML = '';
      container.innerHTML = '';

      for (let h = 0; h < 24; h++) {
        const slot = document.createElement('div');
        slot.className = 'time-slot';
        slot.innerHTML = `<div class="time-label">${String(h).padStart(2, '0')}:00</div><div class="time-lane"></div>`;
        grid.appendChild(slot);
      }

      window.timelineTasks.forEach(task => {
        const item = document.createElement('div');
        item.className = `draggable-task ${task.completed ? 'completed' : ''}`;
        item.style.top = `${(task.startHour || 0) * 60}px`;
        item.style.height = `${Math.max((task.est || 30), 30)}px`;

        item.innerHTML = `
          <span>${task.title}</span>
          <div class="btn-group-mini">
            <button class="btn-del" onclick="removeFromTimeline('${task.id}')">✕</button>
          </div>
        `;

        container.appendChild(item);
      });
    }

    window.removeFromTimeline = function(taskId) {
      window.timelineTasks = window.timelineTasks.filter(t => t.id !== taskId);
      window.saveData();
      renderTimeline();

    window.addQuickTimelineTask = function() {

      const newTask = {

        title: title,
        est: 30,
        startHour: 10,
        completed: false
      };

      window.timelineTasks.push(newTask);
      window.saveData();
      renderTimeline();
    };
