<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク＆タイムライン</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-color: #29b6f6;
      --accent-start: #0288d1;
      --accent-stop: #ff5252;
      --active-bg: #0d233a;
      --slot-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: bold;
      padding: 12px;
    }

    .hidden { display: none !important; }

    .auth-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .tab-header {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 900;
      background-color: #2a2a2a;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000000;
      border-color: var(--accent-color);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="text"], select, textarea {
      background-color: #2c2c2c;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      user-select: text;
    }

    textarea { width: 100%; height: 80px; resize: vertical; }

    button {
      font-weight: 900;
      font-size: 0.95rem;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-add { background-color: var(--accent-color); color: #000; }
    .btn-start { background-color: var(--accent-start); color: #fff; }
    .btn-stop { background-color: var(--accent-stop); color: #fff; }
    .btn-edit { background-color: #f57c00; color: #fff; }
    .btn-del { background-color: #444; color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 8px;
      text-align: left;
      font-size: 0.95rem;
    }

    th { background-color: #2a2a2a; color: var(--text-main); }

    .timer-text {
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .task-sub-info {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: normal;
    }

    .unassigned-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background-color: #1a1a1a;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      min-height: 50px;
      margin-bottom: 12px;
    }

    .pool-item {
      background-color: #0288d1;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: grab;
      touch-action: none;
    }

    .timeline-wrapper {
      position: relative;
      background-color: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .timeline-grid { display: flex; flex-direction: column; }

    .time-slot {
      height: var(--slot-height);
      display: flex;
      border-bottom: 1px solid #2a2a2a;
      position: relative;
    }

    .time-label {
      width: 65px;
      background-color: #222222;
      color: var(--text-sub);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .time-lane { flex: 1; position: relative; }

    .draggable-task {
      position: absolute;
      left: 4px;
      right: 4px;
      background-color: #0288d1;
      color: #ffffff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      cursor: grab;
      touch-action: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .draggable-task:active { cursor: grabbing; opacity: 0.85; z-index: 20; }
    .draggable-task.completed { background-color: var(--accent-color); color: #000000; }

    .resize-handle {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px;
      cursor: ns-resize;
      background: rgba(255,255,255,0.2);
      border-radius: 0 0 6px 6px;
    }

    .btn-group-mini {
      position: absolute;
      right: 4px;
      top: 4px;
      display: flex;
      gap: 4px;
    }

    .btn-group-mini button { padding: 2px 6px; font-size: 0.7rem; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 90%; max-width: 550px;
      max-height: 85vh; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }

    .checklist-item {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }

    .checklist-item input[type="text"] { flex: 1; padding: 6px; }

    .history-log-text {
      background-color: #111;
      color: #29b6f6;
      font-family: monospace;
      padding: 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.9rem;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- 認証ステータスバー -->
  <div class="auth-bar">
    <div id="auth-status-text">未ログイン（非同期モード）</div>
    <div>
      <button id="login-btn" class="btn-add">Googleログイン</button>
      <button id="logout-btn" class="btn-del hidden">ログアウト</button>
    </div>
  </div>

  <!-- タブ切り替えヘッダー -->
  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab('taskTab', this)">📋 タスク管理</button>
    <button class="tab-btn" onclick="switchTab('timelineTab', this)">⏰ タイムライン</button>
  </div>

  <!-- 【タブ1】タスク管理・実行画面 -->
  <div id="taskTab" class="tab-content active">
    <div class="card">
      <h2>1. タスク一括登録（1行につき1タスク）</h2>
      <div class="input-group">
        <textarea id="bulkInput" placeholder="例:&#10;メール返信, 15&#10;資料作成, 45&#10;ミーティング, 30"></textarea>
        <button class="btn-add" onclick="addBulkTasks()">タスクを一括登録する</button>
      </div>
    </div>

    <div class="card">
      <h2>2. 登録済みタスク（着手待ち）</h2>
      <table>
        <thead>
          <tr>
            <th>タスク詳細</th>
            <th>予定(分)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="registeredTableBody"></tbody>
      </table>
    </div>

    <div class="card" style="border: 2px solid var(--accent-color);">
      <h2>3. 実行中テーブル（タイマー計測）</h2>
      <table>
        <thead>
          <tr>
            <th>タスク詳細</th>
            <th>経過時間</th>
            <th>タイマー操作</th>
          </tr>
        </thead>
        <tbody id="activeTableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>4. 本日の完了エリア（画面用）</h2>
      <div style="margin-bottom: 8px; display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn-add" onclick="openHistoryModal()">📅 保存された全記録ログを見る</button>
        <button class="btn-del" onclick="clearCompletedScreenOnly()">🧹 画面のリストを消去（履歴はクラウドに残ります）</button>
        <button class="btn-edit" onclick="downloadCompletedTasks()">📄 テキスト出力(文字化け対策済)</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>タスク名</th>
            <th>開始</th>
            <th>終了</th>
            <th>実績時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 【タブ2】タイムライン画面 -->
  <div id="timelineTab" class="tab-content">
    <div class="card">
      <h2>未配置の登録タスク（ドラッグまたはタップで配置）</h2>
      <div class="unassigned-pool" id="unassignedPool"></div>
    </div>

    <div class="card">
      <h2>24時間 タイムライン（ドラッグで移動・端を引いて長さ変更）</h2>
      <div style="margin-bottom: 10px;">
        <button class="btn-add" onclick="addQuickTimelineTask()">＋ クイックタスク追加</button>
      </div>
      <div class="timeline-wrapper" id="timelineWrapper">
        <div class="timeline-grid" id="timelineGrid"></div>
      </div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 style="margin-bottom:0;">タスクの編集・詳細</h2>
      
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">タスク名</label>
        <input type="text" id="modalName" style="width:100%;">
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">予定時間（分）</label>
        <input type="text" id="modalEst" style="width:100%;">
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">メモ（URL、必要な道具など）</label>
        <textarea id="modalMemo" placeholder="例: 参考URL: https://...\n準備物: ノート、資料"></textarea>
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">工程チェックリスト</label>
        <div id="modalChecklistContainer"></div>
        <button class="btn-add" style="margin-top:4px; font-size:0.8rem;" onclick="addModalChecklistItem()">＋ 項目追加</button>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="btn-del" onclick="closeEditModal()">キャンセル</button>
        <button class="btn-add" onclick="saveModalChanges()">保存</button>
      </div>
    </div>
  </div>

  <!-- 過去ログ閲覧モーダル -->
  <div id="historyModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>📅 永久保存版・日々の活動記録</h2>
      
      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">閲覧したい日付を選択:</label>
        <select id="historyDateSelect" style="width:100%; margin-top:4px;" onchange="loadHistoryLogByDate(this.value)">
          <option value="">日付を選択してください</option>
        </select>
      </div>

      <div>
        <label style="font-size:0.85rem; color:var(--text-sub);">記録ログ（テキスト）:</label>
        <div id="historyLogDisplay" class="history-log-text">日付を選択するとここにログが表示されます</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <button class="btn-edit" onclick="copyHistoryLog()">📋 ログをコピー</button>
        <button class="btn-del" onclick="closeHistoryModal()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK ＆ 全ロジック -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBeBKeUH6NCRux5djZh5-E5GG4AV2yzZVM",
      authDomain: "taskmanager-36d84.firebaseapp.com",
      projectId: "taskmanager-36d84",
      storageBucket: "taskmanager-36d84.firebasestorage.app",
      messagingSenderId: "445804545228",
      appId: "1:445804545228:web:b6f0259243e5acd9296e69"
    };

    const ALLOWED_EMAIL = "owlbird124@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let unsubscribeSnapshot = null;

    window.registeredTasks = JSON.parse(localStorage.getItem('tb_registered')) || [];
    window.activeTasks = JSON.parse(localStorage.getItem('tb_active')) || [];
    window.completedTasks = JSON.parse(localStorage.getItem('tb_completed')) || [];
    window.timelineTasks = JSON.parse(localStorage.getItem('tb_timeline')) || [];
    window.timerInterval = null;
    let editingTaskId = null;

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const statusText = document.getElementById('auth-status-text');

    loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (user.email === ALLOWED_EMAIL) {
          currentUser = user;
          statusText.textContent = `同期中: ${user.email}`;
          loginBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
          setupFirebaseSync();
        } else {
          alert("許可されていないアカウントです。");
          signOut(auth);
        }
      } else {
        currentUser = null;
        statusText.textContent = "未ログイン（ローカル保存のみ）";
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        if (unsubscribeSnapshot) unsubscribeSnapshot();
      }
    });

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    window.saveData = async function() {
      localStorage.setItem('tb_registered', JSON.stringify(window.registeredTasks));
      localStorage.setItem('tb_active', JSON.stringify(window.activeTasks));
      localStorage.setItem('tb_completed', JSON.stringify(window.completedTasks));
      localStorage.setItem('tb_timeline', JSON.stringify(window.timelineTasks));

      if (currentUser) {
        try {
          // アプリ画面用の作業状態を同期
          await setDoc(doc(db, "users", currentUser.uid), {
            registered: window.registeredTasks,
            active: window.activeTasks,
            completed: window.completedTasks,
            timeline: window.timelineTasks,
            updatedAt: new Date().toISOString()
          });
        } catch (e) {
          console.error("Firebase保存エラー:", e);
        }
      }
    };

    // タスク完了時に「日別ログ（daily_logs）」へ永久保存する独立関数
    async function archiveCompletedTaskToFirestore(completedTaskItem) {
      if (!currentUser) return;
      try {
        const todayKey = getTodayKey();
        const logDocRef = doc(db, "users", currentUser.uid, "daily_logs", todayKey);
        
        // 追記（arrayUnion）で配列要素として追加。既存のログを消さずに蓄積
        await setDoc(logDocRef, {
          date: todayKey,
          tasks: arrayUnion(completedTaskItem),
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("永久アーカイブ保存エラー:", e);
      }
    }

    function setupFirebaseSync() {
      if (!currentUser) return;
      const docRef = doc(db, "users", currentUser.uid);

      unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          
          window.registeredTasks = data.registered || [];
          window.activeTasks = data.active || [];
          window.completedTasks = data.completed || [];
          window.timelineTasks = data.timeline || [];

          localStorage.setItem('tb_registered', JSON.stringify(window.registeredTasks));
          localStorage.setItem('tb_active', JSON.stringify(window.activeTasks));
          localStorage.setItem('tb_completed', JSON.stringify(window.completedTasks));
          localStorage.setItem('tb_timeline', JSON.stringify(window.timelineTasks));

          renderAll();
        }
      }, (error) => {
        console.error("Firestore同期エラー:", error);
      });
    }

    function renderAll() {
      renderRegisteredTable();
      renderActiveTable();
      renderHistoryTable();
      if (document.getElementById('timelineTab').classList.contains('active')) {
        renderTimeline();
      }
    }

    window.switchTab = function(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if (tabId === 'timelineTab') renderTimeline();
    };

    window.addBulkTasks = function() {
      const text = document.getElementById('bulkInput').value.trim();
      if (!text) return;
      const lines = text.split('\n');
      lines.forEach(line => {
        if (!line.trim()) return;
        const parts = line.split(/[,，]/);
        const name = parts[0].trim();
        const est = parts[1] ? parseInt(parts[1].trim(), 10) || 15 : 15;
        window.registeredTasks.push({ 
          id: Date.now() + Math.random(), 
          name: name, 
          est: est,
          memo: "",
          checklist: []
        });
      });
      document.getElementById('bulkInput').value = '';
      window.saveData();
      renderRegisteredTable();
    };

    /* --- 過去ログ閲覧機能 --- */
    window.openHistoryModal = async function() {
      document.getElementById('historyModal').classList.remove('hidden');
      const select = document.getElementById('historyDateSelect');
      select.innerHTML = '<option value="">読み込み中...</option>';

      if (!currentUser) {
        select.innerHTML = `<option value="${getTodayKey()}">${getTodayKey()} (本日・ローカル保存)</option>`;
        loadHistoryLogByDate(getTodayKey());
        return;
      }

      try {
        const querySnapshot = await getDocs(collection(db, "users", currentUser.uid, "daily_logs"));
        const dates = [];
        querySnapshot.forEach(doc => dates.push(doc.id));
        dates.sort().reverse();

        if (!dates.includes(getTodayKey())) {
          dates.unshift(getTodayKey());
        }

        select.innerHTML = '<option value="">日付を選択してください</option>';
        dates.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = d === getTodayKey() ? `${d} (本日)` : d;
          select.appendChild(opt);
        });

        select.value = getTodayKey();
        loadHistoryLogByDate(getTodayKey());
      } catch (e) {
        console.error("履歴取得エラー:", e);
        select.innerHTML = '<option value="">エラーが発生しました</option>';
      }
    };

    window.closeHistoryModal = function() {
      document.getElementById('historyModal').classList.add('hidden');
    };

    window.loadHistoryLogByDate = async function(dateStr) {
      const display = document.getElementById('historyLogDisplay');
      if (!dateStr) {
        display.textContent = '日付を選択してください。';
        return;
      }

      display.textContent = '読み込み中...';
      let tasks = [];

      if (currentUser) {
        try {
          const docSnap = await getDoc(doc(db, "users", currentUser.uid, "daily_logs", dateStr));
          if (docSnap.exists()) {
            tasks = docSnap.data().tasks || [];
          } else if (dateStr === getTodayKey()) {
            tasks = window.completedTasks;
          }
        } catch (e) {
          console.error("日別ログ読み込みエラー:", e);
        }
      } else if (dateStr === getTodayKey()) {
        tasks = window.completedTasks;
      }

      if (tasks.length === 0) {
        display.textContent = `【${dateStr}】\n保存された完了タスク記録はありません。`;
        return;
      }

      const lines = tasks.map(t => {
        const startObj = new Date(t.start);
        const endObj = new Date(t.end);
        const startStr = startObj.toTimeString().substring(0, 5);
        const endStr = endObj.toTimeString().substring(0, 5);
        const durMins = Math.round(t.durationSec / 60);
        return `[${startStr} - ${endStr}] ${t.name} (${durMins}分)`;
      });

      display.textContent = `--- ${dateStr} 完了タスク記録 ---\n` + lines.join('\n');
    };

    window.copyHistoryLog = function() {
      const text = document.getElementById('historyLogDisplay').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("ログをクリップボードにコピーしました！");
      }).catch(err => {
        alert("コピーに失敗しました: " + err);
      });
    };

    /* --- 文字化け対策（BOM付き）ファイル出力 --- */
    window.downloadCompletedTasks = function() {
      if (!window.completedTasks || window.completedTasks.length === 0) {
        alert("現在画面に表示されている完了タスクがありません。");
        return;
      }
      const lines = window.completedTasks.map(t => {
        const startObj = new Date(t.start);
        const endObj = new Date(t.end);
        const startStr = startObj.toTimeString().substring(0, 5);
        const endStr = endObj.toTimeString().substring(0, 5);
        const durMins = Math.round(t.durationSec / 60);
        return `[${startStr} - ${endStr}] ${t.name} (${durMins}分)`;
      });

      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `completed_tasks_${getTodayKey()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    };

    /* --- 編集モーダル操作 --- */
    window.openEditModal = function(id) {
      editingTaskId = id;
      const task = window.findTaskById(id);
      if (!task) return;

      document.getElementById('modalName').value = task.name || '';
      document.getElementById('modalEst').value = task.est || task.durationMin || 15;
      document.getElementById('modalMemo').value = task.memo || '';

      const container = document.getElementById('modalChecklistContainer');
      container.innerHTML = '';
      (task.checklist || []).forEach(item => {
        window.addModalChecklistItem(item.text, item.done);
      });

      document.getElementById('editModal').classList.remove('hidden');
    };

    window.closeEditModal = function() {
      document.getElementById('editModal').classList.add('hidden');
      editingTaskId = null;
    };

    window.addModalChecklistItem = function(text = '', done = false) {
      const container = document.getElementById('modalChecklistContainer');
      const div = document.createElement('div');
      div.className = 'checklist-item';
      div.innerHTML = `
        <input type="checkbox" ${done ? 'checked' : ''}>
        <input type="text" value="${escapeHtml(text)}" placeholder="工程を入力">
        <button class="btn-del" onclick="this.parentElement.remove()" style="padding:4px 8px;">✕</button>
      `;
      container.appendChild(div);
    };

    window.saveModalChanges = function() {
      if (!editingTaskId) return;
      const task = window.findTaskById(editingTaskId);
      if (!task) return;

      task.name = document.getElementById('modalName').value.trim() || task.name;
      const estVal = parseInt(document.getElementById('modalEst').value, 10) || 15;
      if (task.est !== undefined) task.est = estVal;
      if (task.durationMin !== undefined) task.durationMin = estVal;
      task.memo = document.getElementById('modalMemo').value.trim();

      const items = [];
      document.querySelectorAll('#modalChecklistContainer .checklist-item').forEach(div => {
        const chk = div.querySelector('input[type="checkbox"]').checked;
        const txt = div.querySelector('input[type="text"]').value.trim();
        if (txt) items.push({ text: txt, done: chk });
      });
      task.checklist = items;

      const tlTask = window.timelineTasks.find(t => t.id === editingTaskId);
      if (tlTask) {
        tlTask.name = task.name;
        tlTask.memo = task.memo;
        tlTask.checklist = task.checklist;
        tlTask.durationMin = estVal;
      }

      window.saveData();
      window.closeEditModal();
      renderAll();
    };

    window.findTaskById = function(id) {
      return window.registeredTasks.find(t => t.id === id) ||
             window.activeTasks.find(t => t.id === id) ||
             window.timelineTasks.find(t => t.id === id);
    };

    window.toggleChecklistItem = function(taskId, itemIndex) {
      const task = window.findTaskById(taskId);
      if (task && task.checklist && task.checklist[itemIndex]) {
        task.checklist[itemIndex].done = !task.checklist[itemIndex].done;
        window.saveData();
        renderAll();
      }
    };

    window.deleteRegistered = function(id) {
      window.registeredTasks = window.registeredTasks.filter(t => t.id !== id);
      window.saveData();
      renderRegisteredTable();
    };

    window.startTaskFromList = function(id) {
      const idx = window.registeredTasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      const task = window.registeredTasks.splice(idx, 1)[0];
      window.activeTasks.push({ 
        id: task.id, 
        name: task.name, 
        est: task.est, 
        memo: task.memo || "",
        checklist: task.checklist || [],
        elapsedSec: 0, 
        isRunning: false, 
        actualStart: null 
      });
      window.saveData();
      renderRegisteredTable();
      renderActiveTable();
    };

    window.returnToRegistered = function(id) {
      const idx = window.activeTasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      const task = window.activeTasks.splice(idx, 1)[0];
      task.isRunning = false;
      checkTimerState();

      window.registeredTasks.push({
        id: task.id,
        name: task.name,
        est: task.est,
        memo: task.memo || "",
        checklist: task.checklist || []
      });

      window.saveData();
      renderRegisteredTable();
      renderActiveTable();
    };

    window.toggleTimer = function(id) {
      const task = window.activeTasks.find(t => t.id === id);
      if (!task) return;
      if (task.isRunning) {
        task.isRunning = false;
      } else {
        window.activeTasks.forEach(t => t.isRunning = false);
        task.isRunning = true;
        if (!task.actualStart) task.actualStart = new Date().toISOString();
      }
      checkTimerState();
      window.saveData();
      renderActiveTable();
    };

    function checkTimerState() {
      const anyRunning = window.activeTasks.some(t => t.isRunning);
      if (anyRunning && !window.timerInterval) {
        window.timerInterval = setInterval(() => {
          window.activeTasks.forEach(t => { if (t.isRunning) t.elapsedSec++; });
          renderActiveTable();
        }, 1000);
      } else if (!anyRunning && window.timerInterval) {
        clearInterval(window.timerInterval);
        window.timerInterval = null;
      }
    }

    window.completeTask = async function(id) {
      const idx = window.activeTasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      const task = window.activeTasks.splice(idx, 1)[0];
      task.isRunning = false;
      checkTimerState();

      const endTime = new Date();
      const startTime = task.actualStart ? new Date(task.actualStart) : endTime;
      const durationMins = Math.max(1, Math.round(task.elapsedSec / 60));
      const startMinutes = startTime.getHours() * 60 + startTime.getMinutes();

      const completedItem = { id: task.id, name: task.name, start: startTime.toISOString(), end: endTime.toISOString(), durationSec: task.elapsedSec };
      
      window.completedTasks.push(completedItem);

      const existingTL = window.timelineTasks.find(t => t.id === task.id);
      if (existingTL) {
        existingTL.isCompleted = true;
        existingTL.durationMin = durationMins;
      } else {
        window.timelineTasks.push({ id: task.id, name: task.name, startMin: startMinutes, durationMin: durationMins, isCompleted: true, memo: task.memo, checklist: task.checklist });
      }

      window.saveData();
      // Firestoreの永久保存用サブコレクションへ追記保存
      await archiveCompletedTaskToFirestore(completedItem);

      renderActiveTable();
      renderHistoryTable();
    };

    /* ★修正点：アプリ画面上のリストからのみ削除（Firebase上の永久ログは残る）★ */
    window.deleteHistory = function(id) {
      window.completedTasks = window.completedTasks.filter(t => t.id !== id);
      window.timelineTasks = window.timelineTasks.filter(t => t.id !== id);
      window.saveData();
      renderHistoryTable();
    };

    /* ★追加：画面上の完了リストを一括でクリアする機能（Firebase上の永久ログは残る）★ */
    window.clearCompletedScreenOnly = function() {
      if (window.completedTasks.length === 0) return;
      if (confirm("画面上の完了タスク表示を削除して一覧をきれいにしますか？\n（※クラウドに保存された日々の過去ログは消えませんのでご安心ください）")) {
        window.completedTasks = [];
        window.saveData();
        renderHistoryTable();
      }
    };

    window.assignTaskToTimeline = function(task) {
      const now = new Date();
      const currentMins = now.getHours() * 60 + Math.floor(now.getMinutes() / 15) * 15;
      window.timelineTasks.push({ 
        id: task.id, 
        name: task.name, 
        startMin: currentMins, 
        durationMin: task.est || 30, 
        isCompleted: false,
        memo: task.memo || "",
        checklist: task.checklist || []
      });
      window.saveData();
      renderTimeline();
    };

    window.addQuickTimelineTask = function() {
      const name = prompt('タスク名を入力してください:', '新規タスク');
      if (!name) return;
      const now = new Date();
      const currentMins = now.getHours() * 60 + Math.floor(now.getMinutes() / 15) * 15;
      window.timelineTasks.push({ 
        id: Date.now(), 
        name: name, 
        startMin: currentMins, 
        durationMin: 30, 
        isCompleted: false,
        memo: "",
        checklist: []
      });
      window.saveData();
      renderTimeline();
    };

    window.deleteTimelineTask = function(id) {
      window.timelineTasks = window.timelineTasks.filter(t => t.id !== id);
      window.saveData();
      renderTimeline();
    };

    function generateSubInfoHtml(task) {
      let html = '';
      if (task.memo) {
        const formattedMemo = escapeHtml(task.memo).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--accent-color);">${1}</a>');
        html += `<div class="task-sub-info">📝 ${formattedMemo}</div>`;
      }
      if (task.checklist && task.checklist.length > 0) {
        const doneCount = task.checklist.filter(c => c.done).length;
        html += `<div class="task-sub-info">☑ チェックリスト (${doneCount}/${task.checklist.length})</div>`;
        html += `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;">`;
        task.checklist.forEach((item, idx) => {
          html += `
            <label style="font-size:0.75rem; color:${item.done ? 'var(--text-sub)' : '#fff'}; user-select:none; cursor:pointer; text-decoration:${item.done ? 'line-through' : 'none'}">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChecklistItem(${task.id}, ${idx})"> ${escapeHtml(item.text)}
            </label>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    function renderRegisteredTable() {
      const tbody = document.getElementById('registeredTableBody');
      tbody.innerHTML = '';
      window.registeredTasks.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <div>${escapeHtml(t.name)}</div>
            ${generateSubInfoHtml(t)}
          </td>
          <td>${t.est}分</td>
          <td>
            <button class="btn-add" onclick="startTaskFromList(${t.id})">着手</button>
            <button class="btn-edit" onclick="openEditModal(${t.id})">詳細/編集</button>
            <button class="btn-del" onclick="deleteRegistered(${t.id})">削除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderActiveTable() {
      const tbody = document.getElementById('activeTableBody');
      tbody.innerHTML = '';
      window.activeTasks.forEach(t => {
        const tr = document.createElement('tr');
        if (t.isRunning) tr.style.backgroundColor = 'var(--active-bg)';
        const hrs = String(Math.floor(t.elapsedSec / 3600)).padStart(2, '0');
        const mins = String(Math.floor((t.elapsedSec % 3600) / 60)).padStart(2, '0');
        const secs = String(t.elapsedSec % 60).padStart(2, '0');
        tr.innerHTML = `
          <td>
            <div>${escapeHtml(t.name)}</div>
            ${generateSubInfoHtml(t)}
          </td>
          <td class="timer-text">${hrs}:${mins}:${secs}</td>
          <td>
            <button class="${t.isRunning ? 'btn-stop' : 'btn-start'}" onclick="toggleTimer(${t.id})">
              ${t.isRunning ? '一時停止' : 'タイマースタート'}
            </button>
            <button class="btn-add" onclick="completeTask(${t.id})">完了</button>
            <button class="btn-edit" onclick="openEditModal(${t.id})">詳細/編集</button>
            <button class="btn-del" onclick="returnToRegistered(${t.id})">一覧に戻す</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderHistoryTable() {
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '';
      window.completedTasks.forEach(t => {
        const tr = document.createElement('tr');
        const startObj = new Date(t.start);
        const endObj = new Date(t.end);
        const startStr = startObj.toTimeString().substring(0, 5);
        const endStr = endObj.toTimeString().substring(0, 5);
        const durMins = Math.round(t.durationSec / 60);
        tr.innerHTML = `
          <td>${escapeHtml(t.name)}</td>
          <td>${startStr}</td>
          <td>${endStr}</td>
          <td>${durMins}分</td>
          <td><button class="btn-del" onclick="deleteHistory(${t.id})">削除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderTimeline() {
      const pool = document.getElementById('unassignedPool');
      pool.innerHTML = '';
      const unassigned = window.registeredTasks.filter(rt => !window.timelineTasks.some(tt => tt.id === rt.id));
      if (unassigned.length === 0) {
        pool.innerHTML = '<span style="color:var(--text-sub); font-size:0.85rem;">未配置の登録タスクはありません</span>';
      } else {
        unassigned.forEach(task => {
          const item = document.createElement('div');
          item.className = 'pool-item';
          item.textContent = `＋ ${task.name} (${task.est}分)`;
          item.onclick = () => window.assignTaskToTimeline(task);
          pool.appendChild(item);
        });
      }

      const grid = document.getElementById('timelineGrid');
      grid.innerHTML = '';
      for (let hour = 0; hour < 24; hour++) {
        const slot = document.createElement('div');
        slot.className = 'time-slot';
        const label = document.createElement('div');
        label.className = 'time-label';
        label.textContent = `${String(hour).padStart(2, '0')}:00`;
        const lane = document.createElement('div');
        lane.className = 'time-lane';
        slot.appendChild(label);
        slot.appendChild(lane);
        grid.appendChild(slot);
      }

      const wrapper = document.getElementById('timelineWrapper');
      window.timelineTasks.forEach(task => {
        const el = document.createElement('div');
        el.className = `draggable-task ${task.isCompleted ? 'completed' : ''}`;
        el.style.top = `${task.startMin}px`;
        el.style.height = `${Math.max(20, task.durationMin)}px`;
        const startH = String(Math.floor(task.startMin / 60)).padStart(2, '0');
        const startM = String(task.startMin % 60).padStart(2, '0');

        let checkInfo = '';
        if (task.checklist && task.checklist.length > 0) {
          const done = task.checklist.filter(c => c.done).length;
          checkInfo = ` (${done}/${task.checklist.length})`;
        }

        el.innerHTML = `
          <div><span>[${startH}:${startM}] ${escapeHtml(task.name)}${checkInfo} (${task.durationMin}分)</span></div>
          <div class="resize-handle"></div>
        `;

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group-mini';
        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.textContent = '✎';
        editBtn.onclick = (e) => { e.stopPropagation(); window.openEditModal(task.id); };
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => { e.stopPropagation(); window.deleteTimelineTask(task.id); };

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(delBtn);
        el.appendChild(btnGroup);
        makeDraggableAndResizable(el, task);
        wrapper.appendChild(el);
      });
    }

    function makeDraggableAndResizable(el, task) {
      let isDragging = false;
      let isResizing = false;
      let startY = 0;
      let initialTop = 0;
      let initialHeight = 0;

      const handleStart = (e) => {
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const target = e.target;
        if (target.classList.contains('resize-handle')) {
          isResizing = true;
        } else if (!target.closest('.btn-group-mini')) {
          isDragging = true;
        } else return;

        startY = clientY;
        initialTop = task.startMin;
        initialHeight = task.durationMin;

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
        document.addEventListener('touchmove', handleMove, { passive: false });
        document.addEventListener('touchend', handleEnd);
      };

      const handleMove = (e) => {
        if (!isDragging && !isResizing) return;
        if (e.cancelable) e.preventDefault();
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = clientY - startY;

        if (isDragging) {
          let newStartMin = Math.round((initialTop + deltaY) / 15) * 15;
          newStartMin = Math.max(0, Math.min(1440 - task.durationMin, newStartMin));
          task.startMin = newStartMin;
          el.style.top = `${newStartMin}px`;
        } else if (isResizing) {
          let newDuration = Math.round((initialHeight + deltaY) / 15) * 15;
          newDuration = Math.max(15, newDuration);
          task.durationMin = newDuration;
          el.style.height = `${newDuration}px`;
        }

        const startH = String(Math.floor(task.startMin / 60)).padStart(2, '0');
        const startM = String(task.startMin % 60).padStart(2, '0');
        const textSpan = el.querySelector('span');
        if (textSpan) textSpan.textContent = `[${startH}:${startM}] ${task.name} (${task.durationMin}分)`;
      };

      const handleEnd = () => {
        if (isDragging || isResizing) {
          isDragging = false;
          isResizing = false;
          window.saveData();
        }
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
        document.removeEventListener('touchmove', handleMove);
        document.removeEventListener('touchend', handleEnd);
      };

      el.addEventListener('mousedown', handleStart);
      el.addEventListener('touchstart', handleStart, { passive: false });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    renderAll();
  </script>
</body>
